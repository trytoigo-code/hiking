<!--
================================================================================
  このアプリについて
  新星の対局記録 — 設計思想と共同編集の進め方
================================================================================

【アプリの目的】
  「新星」（囲碁を始めて半年以上、熱心に打ち続けて急上達中の人）の対局結果を記録する。
  「新星 vs 〇〇」の形で、対局日・手合い・結果・目数差を入力し、履歴で見返せるようにする。
  将来は、月例碁会ごとの「成長の軌跡」（何ができるようになったか）の記録につなげたいが、
  まずは対局結果の記録だけを作る（成長の記事は一旦脇に置いている）。
  現時点では対象は新星1人。

【利用環境】
  - スマホ利用を最優先とする（モバイルファースト）
  - GitHub Pages でホスティング（単一 shinsei.html で完結）
  - Firebase Realtime Database（igo.htmlなどと同じプロジェクト）
    保存先：shinsei/games（対局）・shinsei/config（新星の名前）。
    go-league/state/players は対局相手の名前候補のため読み取りのみ

【技術構成】
  - バニラJS・外部ライブラリなし・ビルド不要・1ファイル完結
  - 配色・部品・合言葉認証は kifu.html / igo.html に合わせている

【セキュリティ】
  - 合言葉認証あり（他アプリと共通）。localStorageに保存

【共同編集の進め方】
  ・このアプリの文脈と歴史を理解した上で提案する
  ・小さな積み重ねを大切にし、既存の操作感や雰囲気を引き継ぐ
  ・機能を追加・変更したら「主な機能」と「今後の改良候補」を合わせて更新する

【主な機能（現時点）】
  - 📝入力タブ：対局日・対局相手（星取の対局者名ボタンか手入力）・新星の手合い
      （相手の手合いは自動表示）・結果（新星の勝ち／負け）・決着（中押し／目数差／
      時間切れ／不明）・目数差（「差は不明」にもできる）・メモ（任意）
  - 📜履歴タブ：通算成績（勝敗・勝率）と、対局日の新しい順の一覧。各対局の修正・削除
      （修正は入力タブに内容を読み込んで「更新する」）
  - ⚙️設定タブ：新星の名前の登録、データエクスポート（JSON）

【今後の改良候補】
  - 持碁の記録
  - 手合いや月ごとの成績の集計
  - 月例碁会ごとの「今月見えた力・前回との違い・次に期待すること」の記録
  - 星取の対局との紐づけ・棋譜URLの登録
================================================================================
-->

<style>
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #fcfaf2; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", YuGothic, sans-serif; background: #fcfaf2; color: #333; }
  #app { max-width: 500px; margin: 0 auto; min-height: 100vh; }

  #header { background: #2c3e50; color: #fff; padding: 14px 16px 10px; text-align: center; position: sticky; top: 0; z-index: 101; }
  #header h1 { font-size: 1.1rem; letter-spacing: 2px; }
  #sync-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 5px; }

  .chip.sel { background: #2c3e50; color: #fff; border-color: #2c3e50; }

  .seg { display: flex; gap: 8px; }

  .seg button.sel-win { background: #fdf1ef; border-color: #b03a2e; color: #b03a2e; }
  .seg button.sel-lose { background: #2c3e50; border-color: #2c3e50; color: #fff; }

  .btn { width: 100%; padding: 13px; background: #2c3e50; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; letter-spacing: 1px; font-family: inherit; }
  .btn:active { opacity: 0.85; }
  .btn-sub { width: 100%; padding: 11px; margin-top: 8px; background: #f0ede4; border: 1px solid #ddd; border-radius: 6px; font-size: 0.92rem; cursor: pointer; font-family: inherit; color: #555; }

  #editing-note { display: none; background: #fff3cd; border: 1px solid #ffc107; color: #856404; border-radius: 8px; padding: 8px 12px; font-size: 0.84rem; font-weight: bold; margin-bottom: 14px; }

  .summary { background: #f1f0ea; border: 1px solid #e0dbcd; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.9rem; color: #2c3e50; }
  .summary strong { font-size: 1.05rem; }

  .game { background: #fff; border: 1px solid #e0dbcd; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .game-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .game-date { font-size: 0.78rem; color: #999; }
  .game-vs { font-size: 0.95rem; margin-top: 3px; line-height: 1.6; color: #2c3e50; }
  .game-vs .teai { font-size: 0.76rem; color: #888; font-weight: normal; }
  .badge { display: inline-block; font-size: 0.72rem; padding: 1px 8px; border-radius: 10px; color: #fff; margin-right: 4px; font-weight: bold; }
  .badge-win { background: #b03a2e; }
  .badge-lose { background: #2c3e50; }
  .badge-type { background: #b89752; }
  .game-memo { margin-top: 8px; font-size: 0.84rem; color: #555; background: #faf8f0; border-left: 3px solid #b89752; padding: 6px 10px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
  .game-btns { flex-shrink: 0; }
  .link-sm { background: none; border: none; color: #aaa; font-size: 0.78rem; cursor: pointer; font-family: inherit; padding: 2px 4px; }

  #setup-banner { display: none; background: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 0.85rem; line-height: 1.7; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2c3e50; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; display: none; z-index: 999; white-space: nowrap; }

<div id="app">
  <div id="header">
    <h1>⭐ 新星の対局記録</h1>
    <div id="sync-row"><span id="sync-dot"></span><span id="sync-label">接続中...</span></div>
  </div>
  <div id="nav">
    <button class="tab-btn active" data-tab="input">📝入力</button>
    <button class="tab-btn" data-tab="history">📜履歴</button>
    <button class="tab-btn" data-tab="setup">⚙️設定</button>
  </div>

  <div id="content">

    <!-- 入力 -->
    <div class="panel active" id="panel-input">
      <div id="setup-banner">⚙️ <strong>Firebase未設定 — ローカル動作中</strong><br>保存するには <code>firebaseConfig</code> を設定してください。</div>
      <h3 id="input-title">対局を記録する</h3>
      <div id="editing-note">✎ 登録済みの対局を修正中です</div>

      <div class="fg"><label>対局日</label><input type="date" id="f-date"></div>

      <div class="fg">
        <label>対局相手</label>

        <div class="chips" id="opp-chips"></div>
      </div>

      <div class="fg">
        <label id="teai-label">新星の手合い</label>

<script>
const firebaseConfig = {
  apiKey:            "AIzaSyBSrQkPMPc-icuph244VBorNqRf2yP-U7Y",
  authDomain:        "hiking-558a9.firebaseapp.com",
  databaseURL:       "https://hiking-558a9-default-rtdb.firebaseio.com",
  projectId:         "hiking-558a9",
  storageBucket:     "hiking-558a9.firebasestorage.app",
  messagingSenderId: "1066293850319",
  appId:             "1:1066293850319:web:94409f01b194d5afe7c7ba"
};
const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const pad = n => String(n).padStart(2, "0");

let games = {}, shinseiName = "", goPlayers = [];
let gamesRef = null, configRef = null;
let editingId = null;
let resultVal = null; // "win" | "lose" | null
let toastTimer = null;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = "none", 2500); }
function setSync(ok) { $("sync-dot").style.background = ok ? "#2ecc71" : "#e74c3c"; $("sync-label").textContent = ok ? "リアルタイム同期中" : "オフライン"; }
const nm = () => shinseiName || "新星";

// ---------- タブ ----------
function showTab(tab) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + tab));
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

// ---------- 手合い ----------
// 新星から見た手合い。相手の手合いはその裏返し（igo.htmlと同じ考え方）
const TEAI_PAIR = { "互先":"互先", "互白":"互黒", "互黒":"互白", "先":"向先", "向先":"先" };
for (let k = 2; k <= 9; k++) { TEAI_PAIR[k + "子"] = "向" + k; TEAI_PAIR["向" + k] = k + "子"; }
const TEAI_OPTIONS = [
  ["互先", "互先（白黒不明）"], ["互白", "互白（コミあり・白番）"], ["互黒", "互黒（コミあり・黒番）"],
  ["先", "先（コミなし・黒番）"], ["2子","2子"], ["3子","3子"], ["4子","4子"], ["5子","5子"], ["6子","6子"], ["7子","7子"], ["8子","8子"], ["9子","9子"],
  ["向先", "向先（新星が上手・コミなし・白番）"], ["向2","向2（新星が上手）"], ["向3","向3（新星が上手）"], ["向4","向4（新星が上手）"]
];
$("f-teai").innerHTML = TEAI_OPTIONS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
$("f-teai").addEventListener("change", () => { $("teai-pair").textContent = TEAI_PAIR[$("f-teai").value] || "互先"; });

// ---------- 結果・決着 ----------
function setResult(v) {
  resultVal = v;
  $("btn-win").className = v === "win" ? "sel-win" : "";
  $("btn-lose").className = v === "lose" ? "sel-lose" : "";
}
$("btn-win").addEventListener("click", () => setResult("win"));
$("btn-lose").addEventListener("click", () => setResult("lose"));
$("f-type").addEventListener("change", () => { $("moku-fg").style.display = $("f-type").value === "moku" ? "" : "none"; });
$("f-margin-unknown").addEventListener("change", () => {
  $("f-margin").disabled = $("f-margin-unknown").checked;
  if ($("f-margin-unknown").checked) $("f-margin").value = "";
});

// ---------- 対局相手：名前ボタン ----------
function oppCandidates() {
  const past = Object.values(games).map(g => g.opponent).filter(Boolean);
  return [...new Set([...goPlayers, ...past])].filter(n => n && n !== shinseiName);
}
function renderOppChips() {
  const cur = $("f-opp").value.trim();
  $("opp-chips").innerHTML = oppCandidates().map(n => `<button type="button" class="chip${cur === n ? " sel" : ""}" data-name="${esc(n)}">${esc(n)}</button>`).join("");
}
$("opp-chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  $("f-opp").value = $("f-opp").value.trim() === c.dataset.name ? "" : c.dataset.name; // もう一度押すと取り消し
  renderOppChips();
});
$("f-opp").addEventListener("input", renderOppChips);

// ---------- フォームの初期化・読み込み ----------
function todayISO() { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; }
function resetForm() {
  editingId = null;
  $("f-date").value = todayISO();
  $("f-opp").value = "";
  $("f-teai").value = "互先"; $("teai-pair").textContent = "互先";
  setResult(null);
  $("f-type").value = "chuoshi"; $("moku-fg").style.display = "none";
  $("f-margin").value = ""; $("f-margin").disabled = false; $("f-margin-unknown").checked = false;
  $("f-memo").value = "";
  $("f-submit").textContent = "登録する";
  $("f-cancel").style.display = "none";
  $("editing-note").style.display = "none";
  $("input-title").textContent = "対局を記録する";
  renderOppChips();
}
function loadForEdit(id) {
  const g = games[id]; if (!g) return;
  editingId = id;
  $("f-date").value = g.date || todayISO();
  $("f-opp").value = g.opponent || "";
  $("f-teai").value = g.teai || "互先"; $("teai-pair").textContent = TEAI_PAIR[g.teai || "互先"] || "互先";
  setResult(g.result === "win" || g.result === "lose" ? g.result : null);
  $("f-type").value = g.type || "fumei";
  $("moku-fg").style.display = g.type === "moku" ? "" : "none";
  const unknown = g.type === "moku" && !g.margin;
  $("f-margin-unknown").checked = unknown;
  $("f-margin").disabled = unknown;
  $("f-margin").value = g.margin || "";
  $("f-memo").value = g.memo || "";
  $("f-submit").textContent = "更新する";
  $("f-cancel").style.display = "";
  $("editing-note").style.display = "block";
  $("input-title").textContent = "対局を修正する";
  renderOppChips();
  showTab("input");
}
$("f-cancel").addEventListener("click", () => { resetForm(); showTab("history"); });

// ---------- 登録・更新 ----------
$("f-submit").addEventListener("click", () => {
  const date = $("f-date").value, opp = $("f-opp").value.trim();
  if (!date) { alert("対局日を入力してください"); return; }
  if (!opp) { alert("対局相手の名前を入力してください"); return; }
  if (!resultVal) { alert("結果（勝ち・負け）を選んでください"); return; }
  const type = $("f-type").value;
  let margin = null;
  if (type === "moku" && !$("f-margin-unknown").checked) {
    margin = parseFloat($("f-margin").value);
    if (isNaN(margin) || margin <= 0) { alert("目数差を正しく入力してください（分からないときは「何目差か忘れた」にチェック）"); return; }
  }
  const data = { date, opponent: opp, teai: $("f-teai").value, result: resultVal, type, margin, memo: $("f-memo").value.trim() || null };
  if (!gamesRef) { alert("データベースに接続されていません"); return; }
  if (editingId) { gamesRef.child(editingId).update({ ...data, editedAt: Date.now() }); toast("更新しました"); }
  else { gamesRef.push({ ...data, at: Date.now() }); toast("対局を登録しました"); }
  resetForm();
  showTab("history");
});

// ---------- 履歴 ----------
const TYPE_LABEL = { chuoshi: "中押し", moku: "目数差", jikan: "時間切れ", fumei: "不明" };
function fmtDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${y}/${parseInt(m)}/${parseInt(d)}`; }
function resultText(g) {
  const t = TYPE_LABEL[g.type] || "";
  if (g.type === "moku") return g.margin ? `${g.margin}目差` : "目数差（差不明）";
  return t;
}
function renderHistory() {
  $("history-title").textContent = `${nm()}の対局履歴`;
  const entries = Object.entries(games).sort((a, b) => (b[1].date || "").localeCompare(a[1].date || "") || (b[1].at || 0) - (a[1].at || 0));
  const w = entries.filter(([, g]) => g.result === "win").length;
  const l = entries.filter(([, g]) => g.result === "lose").length;
  $("summary").innerHTML = entries.length
    ? `<div class="summary">通算 <strong>${entries.length}局</strong>　${w}勝 ${l}敗${w + l ? `（勝率 ${(w / (w + l)).toFixed(2)}）` : ""}</div>`
    : "";
  if (!entries.length) {
    $("list").innerHTML = `<p style="color:#999;font-size:0.88rem">まだ対局がありません。📝入力タブから最初の1局を記録しましょう。</p>`;
    return;
  }
  $("list").innerHTML = entries.map(([id, g]) => {
    const mine = g.teai || "互先", theirs = TEAI_PAIR[mine] || "互先";
    const tm = t => t && t !== "互先" ? `<span class="teai">（${t}）</span>` : "";
    const win = g.result === "win";
    return `<div class="game">
      <div class="game-top">
        <div>
          <div class="game-date">${fmtDate(g.date)}</div>
          <div class="game-vs">${win ? "👑 " : ""}<strong>${esc(nm())}</strong>${tm(mine)}　vs　${!win ? "👑 " : ""}${esc(g.opponent)}${tm(theirs)}</div>
          <div style="margin-top:4px"><span class="badge ${win ? "badge-win" : "badge-lose"}">${win ? "勝ち" : "負け"}</span><span class="badge badge-type">${esc(resultText(g))}</span></div>
        </div>
        <div class="game-btns"><button class="link-sm" data-act="edit" data-id="${id}">修正</button><button class="link-sm" data-act="del" data-id="${id}">削除</button></div>
      </div>
      ${g.memo ? `<div class="game-memo">${esc(g.memo)}</div>` : ""}
    </div>`;
  }).join("");
}
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === "edit") loadForEdit(id);
  else if (b.dataset.act === "del") {
    if (!confirm("この対局の記録を削除しますか？")) return;
    if (gamesRef) gamesRef.child(id).remove();
    if (editingId === id) resetForm();
    toast("削除しました");
  }
});

// ---------- 設定 ----------
let editingName = false;
$("s-name").addEventListener("focus", () => editingName = true);
$("s-name").addEventListener("blur", () => editingName = false);
$("s-save").addEventListener("click", () => {
  const v = $("s-name").value.trim();
  if (configRef) configRef.update({ name: v || null });
  toast("新星の名前を保存しました");
});
$("export-btn").addEventListener("click", () => {
  if (!isConfigured) { toast("データベースに接続されていません"); return; }
  firebase.database().ref("shinsei").once("value", snap => {
    const data = snap.val();
    if (!data) { toast("エクスポートするデータがありません"); return; }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `shinsei_backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click(); URL.revokeObjectURL(url);
    toast("エクスポートしました");
  });
});

// ---------- 画面の更新 ----------
function applyName() {
  document.querySelector("#teai-label").textContent = `${nm()}の手合い`;
  if (!editingName) $("s-name").value = shinseiName;
}
function renderAll() { applyName(); renderOppChips(); renderHistory(); }

// ---------- Firebase（画面まわりの定義が終わってから接続する） ----------
resetForm();
renderAll();
if (isConfigured) {
  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    gamesRef = db.ref("shinsei/games");
    configRef = db.ref("shinsei/config");
    gamesRef.on("value", snap => { games = snap.val() || {}; renderAll(); setSync(true); }, () => setSync(false));
    configRef.on("value", snap => { const c = snap.val() || {}; shinseiName = c.name || ""; renderAll(); }, () => setSync(false));
    // 対局相手の名前候補（星取の対局者名。読み取りのみ）
    db.ref("go-league/state/players").once("value", snap => {
      const arr = snap.val();
      if (Array.isArray(arr)) { goPlayers = arr.filter(Boolean); renderOppChips(); }
    });
  } catch (e) { console.error(e); setSync(false); }
} else {
  $("setup-banner").style.display = "block";
  setSync(false);
}
</script>
</body>
</html>
