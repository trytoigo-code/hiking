<!--
================================================================================
  このアプリについて
  山あるき — 設計思想と共同編集の進め方
================================================================================

【アプリの目的】
  囲碁・麻雀のリーグ戦管理アプリ群のポータルページ。
  山あるきメンバーが各アプリにアクセスするための入口として機能する。

【利用環境】
  - スマホ利用を最優先とする（モバイルファースト）
  - GitHub Pages でホスティング（単一 index.html で完結）
  - 各アプリへのリンクを管理する

【技術構成】
  - 基本は純粋なHTML/CSS。テロップ（後述）表示のためだけに、最小限のJSとFirebase
    読み取り専用アクセスを追加している
  - 外部ライブラリなし・ビルド不要・1ファイル完結
  - シンプルさを最優先とする（テロップも含め、書き込みは一切行わない）

【テロップについて】
  タイトルの下は2段構成になっている。
    ①語録行（静止表示）：囲碁 一局一得（goroku.html）の語録から、1日に複数回切り替わる
      形で1件表示する（後述）
    ②その他の行（横に流れる）：igo.html（go-league/state）・mahjong.html（mahjong/state）
      を読み取り専用で参照し、ページを開くたびに以下を組み立てて流す（保存はしない）
        ・📊通算対局数（囲碁◯局・麻雀◯半荘）
        ・⚫囲碁 勝数1位（今シーズン）
        ・🀄麻雀 総合ポイント1位（今シーズン）
        ・📋囲碁・麻雀それぞれの最新の対局
        ・😴 最後の対局から2週間以上空いている人への呼びかけ（囲碁・麻雀それぞれ。
          該当者がいない場合はその項目を出さない）
        ・🎯囲碁 3連勝以上の人（相手問わず。いなければ出さない）
        ・🎯囲碁 半目職人（半目差での勝利数が最も多い人。実績が無ければ出さない）
        ・🤝囲碁 最多対戦の組み合わせ
        ・💬囲碁・麻雀それぞれの人気コメント（対局コメントのうち、絵文字リアクションの
          合計数が最も多いもの。1件も反応が付いていなければ出さない）
  流れるのは②の行だけで、①の語録行は流さず固定表示する（1件だけなので流す必要がない）。
  ②の行はタップすると流れが止まり、もう一度タップすると止まった位置から再び流れ出す。
  総合順位（sogo.html）の1位は含めない。sogo.htmlのレーティング計算＋メンバー対応づけ
  ロジックをこちらにも複製することになり、index.htmlの複雑さに見合わないため見送った。

  【語録の切り替えについて】
  goroku.htmlの語録（33件・テキストと語り手）を、このファイルにも配列としてそのまま
  複製している（goroku.html側はFirebaseに保存しておらず、JS内の定数のため、参照する
  にはコピーするしかない）。1日を朝（5:00〜）・昼（11:00〜）・夕方（17:00〜翌5:00）の
  3つの時間帯（TELOP_QUOTE_SLOT_HOURS）に分け、日付＋時間帯の文字列をもとにした簡易
  ハッシュで配列のインデックスを決める。同じ時間帯は誰が見ても同じ1件、時間帯が変わると
  ランダムな別の1件になる（単純な順送りではない）。深夜0時〜朝5時は前日の夕方の枠を
  そのまま引き継ぎ、意味もなく夜中に切り替わらないようにしている。
  ページを開いたときに決まる値なので、同じタブを開きっぱなしでも時間帯をまたぐまでは
  切り替わらない。
  goroku.htmlの語録を追加・変更・削除したら、このファイル内のGOROKU_QUOTESも
  必ず合わせて更新すること。

【共同編集の進め方】
  このアプリは、ユーザーと生成AIが対話しながら少しずつ育てていくものです。
  以下は、その共同作業をうまく続けるための共通認識です。

  ・このアプリの文脈と歴史を理解した上で提案する
  ・変更の意図と影響範囲を共有しながら進める
  ・小さな積み重ねを大切にし、一度に大きく変えない
  ・既存の操作感や雰囲気はできるだけ引き継ぐ
  ・読みやすく・触りやすく・壊れにくい構成を選ぶ
  ・新しい技術より、長く使い続けられることを優先する
  ・アプリを追加・変更したら「収録アプリ」を合わせて更新する

【収録アプリ（現時点）】
  - 足あと（ashiato.html）：仲間との活動記録・希望地の共有
  - 総合順位（sogo.html）：星取（igo.html）×点棒（mahjong.html）のレーティングをもとにした総合順位
  - 囲碁リーグ戦「星取」（igo.html）：星取表・履歴・手合い管理
  - 麻雀リーグ戦「点棒」（mahjong.html）：成績・順位・履歴の共有
  - 囲碁 一局一得（goroku.html）：対局前に考え、対局後に学ぶアプリ。しおり機能付き
  - 囲碁読み物（dangi.html）：囲碁にまつわる読み物・考察、みんなの投稿掲示板
  - 大石道場杯（tournament.html）：8人勝ち抜き大会の対戦表・結果共有

  ボタンは名称のみを表示し、説明文は置かない（縦スクロールを減らすため。2026-09-26変更）。
  タイトル下のテロップの仕組みは【テロップについて】を参照。
================================================================================
-->

function telopDateSortValue(dateStr) {
  if (!dateStr) return 0;
  const parts = String(dateStr).split(" ")[0].split("/").map(n => parseInt(n, 10));
  if (parts.length === 3 && !parts.some(isNaN)) {
    const [y, mo, dy] = parts;
    return y * 10000 + mo * 100 + dy;
  }
  return 0;
}
function telopParseDate(dateStr) {
  if (!dateStr) return null;
  const parts = String(dateStr).split(" ")[0].split("/").map(n => parseInt(n, 10));
  if (parts.length === 3 && !parts.some(isNaN)) return new Date(parts[0], parts[1] - 1, parts[2]);
  return null;
}
function telopFormatMD(dateStr) {
  const d = telopParseDate(dateStr);
  return d ? `${d.getMonth() + 1}/${d.getDate()}` : (dateStr || "");
}
const TELOP_NEGLECT_DAYS = 14; // これ以上空いていたら「そろそろ」の呼びかけを出す

// ---- 人気コメント（反応の数が最も多いコメントを拾う。囲碁・麻雀共通で使う） ----
function telopCountReactions(comment) {
  if (!comment || typeof comment !== "object" || !comment.reactions) return 0;
  return Object.values(comment.reactions).reduce((sum, names) => sum + (Array.isArray(names) ? names.length : 0), 0);
}
function telopBuildTopCommentItem(history, label) {
  let best = null;
  (history || []).forEach(m => {
    const c = m.comment;
    if (!c || typeof c !== "object" || !c.text) return;
    const score = telopCountReactions(c);
    if (score > 0 && (!best || score > best.score)) best = { text: c.text, author: c.author || "", score };
  });
  if (!best) return null;
  const who = best.author ? `${best.author}さん：` : "";
  return `💬${label} 人気コメント：${who}「${best.text}」（反応${best.score}件）`;
}

// 日付＋時間帯（朝・昼・夕方）の文字列から簡易ハッシュを作り、その時間帯だけの
// インデックスを決める（単純な順送りにはせず、時間帯が変わるとランダムな別の1件になる）。
// 深夜0時〜最初の時刻（TELOP_QUOTE_SLOT_HOURSの先頭）の前は、前日の夕方の枠を
// そのまま引き継ぐ（夜中に切り替えても誰も見ていないので意味がないため）。
const TELOP_QUOTE_SLOT_HOURS = [5, 11, 17]; // 朝5時・昼11時・夕方17時に切り替える
function pickDailyGorokuQuote() {
  const now = new Date();
  const h = now.getHours();
  const dayStart = TELOP_QUOTE_SLOT_HOURS[0];
  const effectiveDate = new Date(now);
  let slotIdx;
  if (h < dayStart) {
    effectiveDate.setDate(effectiveDate.getDate() - 1);
    slotIdx = TELOP_QUOTE_SLOT_HOURS.length - 1; // 深夜は前日いちばん最後の枠のまま
  } else {
    slotIdx = 0;
    for (let i = TELOP_QUOTE_SLOT_HOURS.length - 1; i >= 0; i--) {
      if (h >= TELOP_QUOTE_SLOT_HOURS[i]) { slotIdx = i; break; }
    }
  }
  const key = `${effectiveDate.getFullYear()}-${effectiveDate.getMonth() + 1}-${effectiveDate.getDate()}-${slotIdx}`;
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
  return GOROKU_QUOTES[hash % GOROKU_QUOTES.length];
}

// ---- 囲碁（星取）：勝数1位・最新の対局・ご無沙汰 ----
const TELOP_BLACK_TEAI = ["先", "2子", "3子", "4子"];
function telopIgoJigoWinner(m) {
  if (TELOP_BLACK_TEAI.includes(m.teai1)) return m.p1;
  if (TELOP_BLACK_TEAI.includes(m.teai2)) return m.p2;
  return null;
}
function buildIgoTelopItems(state) {
  const items = [];
  const players = state.players || [];
  const history = state.history || []; // 新しい対局が先頭（igo.html側でunshiftしているため）
  if (players.length === 0 || history.length === 0) return items;

  const wins = {}, losses = {}, lastPlayed = {};
  players.forEach(p => { wins[p] = 0; losses[p] = 0; });

  history.forEach(m => {
    const involved = (m.type === "jigo" || m.type === "mushoubu") ? [m.p1, m.p2] : [m.winner, m.loser];
    const val = telopDateSortValue(m.date);
    involved.forEach(p => {
      if (!players.includes(p)) return;
      if (!lastPlayed[p] || val > lastPlayed[p].val) lastPlayed[p] = { val, date: m.date };
    });
    if (m.shidou || m.type === "mushoubu") return; // 指導対局・無勝負は勝数に数えない
    let w, l;
    if (m.type === "jigo") { w = telopIgoJigoWinner(m); if (!w) return; l = (w === m.p1) ? m.p2 : m.p1; }
    else { w = m.winner; l = m.loser; }
    if (w in wins) wins[w]++;
    if (l in losses) losses[l]++;
  });

  const top = players.slice().sort((a, b) => wins[b] - wins[a])
    .find(p => wins[p] > 0 || losses[p] > 0);
  if (top) items.push(`⚫囲碁 勝数1位：${top}さん（${wins[top]}勝${losses[top]}敗）`);

  const latest = history[0];
  if (latest) {
    const [a, b] = (latest.type === "jigo" || latest.type === "mushoubu") ? [latest.p1, latest.p2] : [latest.winner, latest.loser];
    if (a && b) items.push(`📋最新の対局（囲碁）：${a}さん vs ${b}さん（${telopFormatMD(latest.date)}）`);
  }

  const oldest = players.map(p => ({ p, info: lastPlayed[p] || null }))
    .filter(x => x.info).sort((x, y) => x.info.val - y.info.val)[0];
  if (oldest) {
    const d = telopParseDate(oldest.info.date);
    const days = d ? Math.floor((new Date() - d) / 86400000) : null;
    if (days !== null && days >= TELOP_NEGLECT_DAYS) {
      items.push(`😴 囲碁でしばらく打っていない${oldest.p}さん、そろそろ一局いかがですか？（${days}日ぶり）`);
    }
  }

  // 連勝中の人（相手問わず。対局した順に見て、今も勝ちが続いている人のみ対象。3連勝以上で表示）
  const ordered = history.slice().sort((a, b) => telopDateSortValue(a.date) - telopDateSortValue(b.date));
  const streaks = {};
  players.forEach(p => { streaks[p] = 0; });
  ordered.forEach(m => {
    if (m.shidou || m.type === "mushoubu") return;
    let w, l;
    if (m.type === "jigo") { w = telopIgoJigoWinner(m); if (!w) return; l = (w === m.p1) ? m.p2 : m.p1; }
    else { w = m.winner; l = m.loser; }
    if (w in streaks) streaks[w] = (streaks[w] || 0) + 1;
    if (l in streaks) streaks[l] = 0;
  });
  const streakTop = players.slice().sort((a, b) => streaks[b] - streaks[a])[0];
  if (streakTop && streaks[streakTop] >= 3) items.push(`🎯囲碁 ${streaks[streakTop]}連勝中：${streakTop}さん`);

  // 半目職人（半目差での勝利数が最も多い人）
  const hanmeCounts = {};
  history.forEach(m => {
    if (m.shidou) return;
    if (m.type === "moku" && m.mokusuu === 0.5) hanmeCounts[m.winner] = (hanmeCounts[m.winner] || 0) + 1;
  });
  const hanmeTop = Object.keys(hanmeCounts).sort((a, b) => hanmeCounts[b] - hanmeCounts[a])[0];
  if (hanmeTop) items.push(`🎯囲碁 半目職人：${hanmeTop}さん（半目勝ち${hanmeCounts[hanmeTop]}回）`);

  // 最多対戦の組み合わせ（指導対局・無勝負も「対局した回数」として数える）
  const pairCounts = {};
  history.forEach(m => {
    const [a, b] = (m.type === "jigo" || m.type === "mushoubu") ? [m.p1, m.p2] : [m.winner, m.loser];
    if (!players.includes(a) || !players.includes(b)) return;
    const key = [a, b].sort().join("|");
    pairCounts[key] = (pairCounts[key] || 0) + 1;
  });
  const topPairKey = Object.keys(pairCounts).sort((x, y) => pairCounts[y] - pairCounts[x])[0];
  if (topPairKey) {
    const [pa, pb] = topPairKey.split("|");
    items.push(`🤝囲碁 最多対戦：${pa}さん×${pb}さん（${pairCounts[topPairKey]}局）`);
  }

  const topComment = telopBuildTopCommentItem(history, "囲碁");
  if (topComment) items.push(topComment);

  return items;
}

// ---- 麻雀（点棒）：総合ポイント1位・最新の対局・ご無沙汰 ----
function telopMjOverallRanks(m, chipRate) {
  const combined = m.points.map((pt, i) => pt + (m.chips ? (m.chips[i] || 0) : 0) * chipRate);
  const order = combined.map((v, i) => ({ i, v })).sort((a, b) => b.v - a.v);
  const ranks = new Array(combined.length);
  order.forEach((o, idx) => { ranks[o.i] = idx + 1; });
  return ranks;
}
function buildMahjongTelopItems(state) {
  const items = [];
  const players = state.players || [];
  const history = state.history || []; // 新しい対局が末尾（mahjong.html側でpushしているため）
  if (players.length === 0 || history.length === 0) return items;
  const chipRate = (typeof state.chipRate === "number") ? state.chipRate : 1;

  const totals = {}, lastPlayed = {};
  players.forEach(p => { totals[p] = 0; });

  history.forEach(m => {
    const ps = m.players || players;
    ps.forEach((p, i) => {
      if (!(p in totals)) totals[p] = 0;
      totals[p] += (m.points ? (m.points[i] || 0) : 0) + (m.chips ? (m.chips[i] || 0) : 0) * chipRate;
    });
    const val = telopDateSortValue(m.date);
    ps.forEach(p => { if (!lastPlayed[p] || val > lastPlayed[p].val) lastPlayed[p] = { val, date: m.date }; });
  });

  const topName = Object.keys(totals).sort((a, b) => totals[b] - totals[a])[0];
  if (topName !== undefined) {
    const pt = Number((totals[topName] || 0).toFixed(1));
    items.push(`🀄麻雀 総合ポイント1位：${topName}さん（${pt > 0 ? "+" : ""}${pt}pt）`);
  }

  const latest = history[history.length - 1];
  if (latest && latest.points) {
    const ranks = telopMjOverallRanks(latest, chipRate);
    const winnerIdx = ranks.indexOf(1);
    const winnerName = (latest.players || players)[winnerIdx];
    if (winnerName) items.push(`📋最新の対局（麻雀）：${winnerName}さんが1位（${telopFormatMD(latest.date)}）`);
  }

  const oldest = Object.keys(lastPlayed).filter(p => players.includes(p))
    .map(p => ({ p, info: lastPlayed[p] })).sort((x, y) => x.info.val - y.info.val)[0];
  if (oldest) {
    const d = telopParseDate(oldest.info.date);
    const days = d ? Math.floor((new Date() - d) / 86400000) : null;
    if (days !== null && days >= TELOP_NEGLECT_DAYS) {
      items.push(`😴 麻雀でしばらく打っていない${oldest.p}さん、そろそろ卓を囲みませんか？（${days}日ぶり）`);
    }
  }

  const topComment = telopBuildTopCommentItem(history, "麻雀");
  if (topComment) items.push(topComment);

  return items;
}

// ---- 通算対局数（囲碁・麻雀の両方が必要なので、単独では組み立てない） ----
function buildTotalCountItem(igoState, mjState) {
  const igoCount = (igoState.history || []).length;
  const mjHanchans = (mjState.history || []).reduce((sum, m) => sum + ((m.hanchans && m.hanchans >= 1) ? m.hanchans : 1), 0);
  if (igoCount === 0 && mjHanchans === 0) return null;
  return `📊通算対局数：囲碁${igoCount}局・麻雀${mjHanchans}半荘`;
}

function renderTelop(igoState, mjState) {
  const q = pickDailyGorokuQuote();
  document.getElementById("telop-quote").textContent = `📖今日の語録：「${q.text}」―${q.by}`;

  const totalCountItem = buildTotalCountItem(igoState || {}, mjState || {});
  const items = [
    ...(totalCountItem ? [totalCountItem] : []),
    ...buildIgoTelopItems(igoState || {}),
    ...buildMahjongTelopItems(mjState || {})
  ];
  const text = items.length ? items.join("　★　") : "🏔️ 山あるき、はじまります！";
  const segA = document.getElementById("telop-seg-a");
  const segB = document.getElementById("telop-seg-b");
  segA.textContent = text;
  segB.textContent = text;
  requestAnimationFrame(() => {
    const track = document.getElementById("telop-track");
    const singleWidth = segA.getBoundingClientRect().width;
    const speed = 60; // px/秒（流れる速さ）
    const duration = Math.max(singleWidth / speed, 8);
    track.style.animationDuration = duration + "s";
    track.classList.add("scrolling");
  });
}

(function() {
  document.getElementById("telop-wrap").addEventListener("click", () => {
    document.getElementById("telop-track").classList.toggle("paused");
  });

  if (firebaseConfig.apiKey === "YOUR_API_KEY") { renderTelop(null, null); return; }
  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let igoState = null, mjState = null;
    function tryRender() {
      if (igoState === null || mjState === null) return;
      renderTelop(igoState, mjState);
    }
    db.ref("go-league/state").once("value")
      .then(snap => { igoState = snap.val() || {}; tryRender(); })
      .catch(() => { igoState = {}; tryRender(); });
    db.ref("mahjong/state").once("value")
      .then(snap => { mjState = snap.val() || {}; tryRender(); })
      .catch(() => { mjState = {}; tryRender(); });
  } catch (e) {
    console.error("Firebase init failed:", e);
    renderTelop(null, null);
  }
})();
</script>
