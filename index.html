<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>囲碁リーグ管理 - 星取</title>
    <style>
        :root {
            --bg-color: #fcfaf2;
            --box-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #b89752;
            --text: #333333;
            --border: #e0dbcd;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Hiragino Kaku Gothic ProN, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--box-bg);
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .nav-tabs {
            display: flex;
            background: #f1f0ea;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            border: none;
            background: none;
            font-size: 0.85rem;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }
        .tab-btn.active {
            color: var(--primary);
            background: var(--box-bg);
            border-bottom: 3px solid var(--accent);
        }
        .content {
            padding: 20px;
            flex: 1;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        h3 {
            border-left: 4px solid var(--accent);
            padding-left: 8px;
            margin-top: 0;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button.btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button.btn:active { background: #1a252f; }
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #faf9f5;
        }
        .matrix-table th, .matrix-table td {
            border: 1px solid var(--border);
            padding: 10px 5px;
            text-align: center;
            font-size: 0.9rem;
        }
        .matrix-table th { background: #f1f0ea; color: var(--primary); }
        .stone {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            line-height: 20px;
            text-align: center;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .stone.win { background: #333; color: white; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        .stone.lose { background: #fff; color: #333; border: 1px solid #ccc; box-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
        .stone.jigo { background: #888; color: white; box-shadow: 1px 1px 3px rgba(0,0,0,0.2); }
        .result-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .badge-chuoshi { background: #2c3e50; color: white; }
        .badge-moku { background: #b89752; color: white; }
        .badge-jigo { background: #888; color: white; }
        #mokusuu-group { display: none; }
        .ranking-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }
        .rank-num { width: 30px; font-weight: bold; color: var(--accent); }
        .player-info { flex: 1; }
        .progress-bar {
            background: #eee;
            height: 6px;
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
        }
        .progress-fill { background: var(--accent); height: 100%; width: 0%; }
        .history-item {
            background: #fdfdfb;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-del {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="app-container">
    <header>囲碁リーグ戦管理「星取」</header>
    
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tab-setup', this)">設定</button>
        <button class="tab-btn" onclick="switchTab('tab-input', this)">対局入力</button>
        <button class="tab-btn" onclick="switchTab('tab-standings', this)">星取表</button>
        <button class="tab-btn" onclick="switchTab('tab-history', this)">履歴</button>
        <button class="tab-btn" onclick="switchTab('tab-handicap', this)">次の手合い</button>
    </div>

    <div class="content">
        <div id="tab-setup" class="panel active">
            <h3>メンバー登録</h3>
            <div class="form-group"><label>プレイヤー 1</label><input type="text" id="p1-name" value="プレイヤー1"></div>
            <div class="form-group"><label>プレイヤー 2</label><input type="text" id="p2-name" value="プレイヤー2"></div>
            <div class="form-group"><label>プレイヤー 3</label><input type="text" id="p3-name" value="プレイヤー3"></div>
            <div class="form-group"><label>プレイヤー 4</label><input type="text" id="p4-name" value="プレイヤー4"></div>
            <button class="btn" onclick="savePlayers()">名前を保存する</button>
        </div>

        <div id="tab-input" class="panel">
            <h3>対局結果の入力</h3>
            <div class="form-group"><label>結果の種類</label>
                <select id="result-type" onchange="onResultTypeChange()">
                    <option value="chuoshi">中押し</option>
                    <option value="moku">目数差</option>
                    <option value="jigo">持碁（引き分け）</option>
                </select>
            </div>
            <div class="form-group" id="winner-group"><label>勝った人</label><select id="winner-select"></select></div>
            <div class="form-group" id="loser-group"><label>負けた人</label><select id="loser-select"></select></div>
            <div class="form-group" id="mokusuu-group">
                <label>目数差（半目単位可）</label>
                <input type="number" id="mokusuu" min="0.5" step="0.5" value="6.5" placeholder="例: 6.5">
            </div>
            <div class="form-group" id="jigo-p1-group" style="display:none;"><label>対局者 A</label><select id="jigo-p1-select"></select></div>
            <div class="form-group" id="jigo-p2-group" style="display:none;"><label>対局者 B</label><select id="jigo-p2-select"></select></div>
            <button class="btn" onclick="addMatch()">対局結果を登録</button>
        </div>

        <div id="tab-standings" class="panel">
            <h3>現在の順位</h3><div id="ranking-list"></div><br>
            <h3>対戦マトリクス</h3><table class="matrix-table" id="matrix-grid"></table>
        </div>

        <div id="tab-history" class="panel">
            <h3>対局履歴</h3><div id="history-list"></div>
        </div>

        <div id="tab-handicap" class="panel">
            <h3>次期の自動手合い決定</h3>
            <p style="font-size:0.85rem; color:#666;">※10局消化した時点で、単独1位と単独4位のみ「先」、他は「互先」になります。</p>
            <table class="matrix-table">
                <thead><tr><th>対戦カード</th><th>次期の手合い</th></tr></thead>
                <tbody id="handicap-list"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
 projectId: "YOUR_PROJECT",
 storageBucket: "YOUR_PROJECT.appspot.com",
 messagingSenderId: "000000000000",
 appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const stateRef = ref(db, "hoshidori/appState");
let appState = {
 players:["プレイヤー1","プレイヤー2","プレイヤー3","プレイヤー4"],
 history:[]
};
function saveState(){ set(stateRef, appState); }
function showToast(msg){
 const t=document.getElementById('toast');
 t.textContent=msg;
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),2000);
}
function init(){
 onValue(stateRef,(snapshot)=>{
  const data=snapshot.val();
  if(data){appState=data;} else {saveState();}
  document.getElementById('p1-name').value = appState.players[0];
  document.getElementById('p2-name').value = appState.players[1];
  document.getElementById('p3-name').value = appState.players[2];
  document.getElementById('p4-name').value = appState.players[3];
  updateDropdowns();
  renderAll();
 });
}

    

    

    

    function savePlayers() {
        appState.players[0] = document.getElementById('p1-name').value || "プレイヤー1";
        appState.players[1] = document.getElementById('p2-name').value || "プレイヤー2";
        appState.players[2] = document.getElementById('p3-name').value || "プレイヤー3";
        appState.players[3] = document.getElementById('p4-name').value || "プレイヤー4";
        updateDropdowns();
        renderAll();
        saveState();
        showToast("メンバー名を保存しました！");
    }

    function onResultTypeChange() {
        const t = document.getElementById('result-type').value;
        document.getElementById('winner-group').style.display = t === 'jigo' ? 'none' : '';
        document.getElementById('loser-group').style.display = t === 'jigo' ? 'none' : '';
        document.getElementById('mokusuu-group').style.display = t === 'moku' ? 'block' : 'none';
        document.getElementById('jigo-p1-group').style.display = t === 'jigo' ? '' : 'none';
        document.getElementById('jigo-p2-group').style.display = t === 'jigo' ? '' : 'none';
    }

    function updateDropdowns() {
        ['winner-select','loser-select','jigo-p1-select','jigo-p2-select'].forEach(id => {
            const sel = document.getElementById(id);
            if (!sel) return;
            const prev = sel.value;
            sel.innerHTML = '';
            appState.players.forEach(p => { sel.innerHTML += `<option value="${p}">${p}</option>`; });
            if (prev && appState.players.includes(prev)) sel.value = prev;
        });
        const ls = document.getElementById('loser-select');
        const jp2 = document.getElementById('jigo-p2-select');
        if (ls && appState.players.length > 1) ls.selectedIndex = 1;
        if (jp2 && appState.players.length > 1) jp2.selectedIndex = 1;
    }

    function resultLabel(m) {
        if (m.type === 'jigo') return `<span class="result-badge badge-jigo">持碁</span>`;
        if (m.type === 'chuoshi') return `<span class="result-badge badge-chuoshi">中押し</span>`;
        if (m.type === 'moku') return `<span class="result-badge badge-moku">${m.mokusuu}目差</span>`;
        return '';
    }

    function addMatch() {
        const t = document.getElementById('result-type').value;
        const now = new Date();
        const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

        if (t === 'jigo') {
            const p1 = document.getElementById('jigo-p1-select').value;
            const p2 = document.getElementById('jigo-p2-select').value;
            if (p1 === p2) { showToast("対局者AとBに同じ人は選べません"); return; }
            appState.history.unshift({ type: 'jigo', p1, p2, date: dateStr });
            renderAll(); saveState(); showToast(`${p1} vs ${p2}：持碁を登録しました`);
        } else {
            const w = document.getElementById('winner-select').value;
            const l = document.getElementById('loser-select').value;
            if (w === l) { showToast("勝者と敗者に同じ人は選べません"); return; }
            const mokusuu = t === 'moku' ? parseFloat(document.getElementById('mokusuu').value) : null;
            if (t === 'moku' && (isNaN(mokusuu) || mokusuu <= 0)) { showToast("目数差を正しく入力してください"); return; }
            appState.history.unshift({ type: t, winner: w, loser: l, mokusuu, date: dateStr });
            renderAll();
            saveState();
            const label = t === 'chuoshi' ? '中押し' : `${mokusuu}目差`;
            showToast(`${w} の勝利（${label}）を登録しました！`);
        }
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        renderAll();
    }

    function deleteMatch(idx) {
        if(confirm("この対局記録を削除しますか？")) {
            appState.history.splice(idx, 1);
            renderAll();
            saveState();
            showToast("削除しました");
        }
    }

    function calculateStats() {
        let stats = {};
        appState.players.forEach(p => stats[p] = { wins: 0, losses: 0, jigo: 0, total: 0, name: p });
        appState.history.forEach(m => {
            if (m.type === 'jigo') {
                if (stats[m.p1]) { stats[m.p1].jigo++; stats[m.p1].total++; }
                if (stats[m.p2]) { stats[m.p2].jigo++; stats[m.p2].total++; }
            } else {
                if (stats[m.winner]) { stats[m.winner].wins++; stats[m.winner].total++; }
                if (stats[m.loser])  { stats[m.loser].losses++; stats[m.loser].total++; }
            }
        });
        return stats;
    }

    function renderAll() {
        const stats = calculateStats();
        const sorted = Object.values(stats).sort((a,b) => b.wins - a.wins);

        // 順位
        const rankList = document.getElementById('ranking-list');
        rankList.innerHTML = '';
        sorted.forEach((p, i) => {
            const pct = Math.min((p.total / 10) * 100, 100);
            const jigoStr = p.jigo > 0 ? ` ${p.jigo}持碁` : '';
            rankList.innerHTML += `
                <div class="ranking-item">
                    <div class="rank-num">${i+1}位</div>
                    <div class="player-info">
                        <strong>${p.name}</strong> — ${p.wins}勝 ${p.losses}敗${jigoStr}
                        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                    </div>
                </div>`;
        });

        // マトリクス
        const grid = document.getElementById('matrix-grid');
        grid.innerHTML = `<tr><th>相手↑<br>自分→</th>` + appState.players.map(p => `<th>${p}</th>`).join('') + `</tr>`;
        appState.players.forEach(p1 => {
            let rowHtml = `<tr><th>${p1}</th>`;
            appState.players.forEach(p2 => {
                if (p1 === p2) { rowHtml += `<td style="background:#eee;">-</td>`; }
                else {
                    let cells = [];
                    [...appState.history].reverse().forEach(m => {
                        if (m.type === 'jigo' && ((m.p1 === p1 && m.p2 === p2)||(m.p1 === p2 && m.p2 === p1))) {
                            cells.push(`<span class="stone jigo" title="持碁">△</span>`);
                        }
                        if (m.winner === p1 && m.loser === p2) cells.push(`<span class="stone win" title="${m.type==='chuoshi'?'中押し':m.mokusuu+'目差'}">●</span>`);
                        if (m.winner === p2 && m.loser === p1) cells.push(`<span class="stone lose" title="${m.type==='chuoshi'?'中押し':m.mokusuu+'目差'}">○</span>`);
                    });
                    rowHtml += `<td>${cells.length ? cells.join(' ') : ''}</td>`;
                }
            });
            grid.innerHTML += rowHtml + `</tr>`;
        });

        // 履歴
        const histList = document.getElementById('history-list');
        histList.innerHTML = appState.history.length === 0 ? '<p style="color:#999;">対局記録はありません。</p>' : '';
        appState.history.forEach((m, idx) => {
            let matchStr = '';
            if (m.type === 'jigo') {
                matchStr = `<strong>${m.p1}</strong> vs <strong>${m.p2}</strong> ${resultLabel(m)}`;
            } else {
                matchStr = `<strong>${m.winner}</strong> 👑 (勝) vs ${m.loser} ${resultLabel(m)}`;
            }
            histList.innerHTML += `
                <div class="history-item">
                    <div>${matchStr}<br><span style="font-size:0.8rem;color:#999;">${m.date}</span></div>
                    <button class="btn-del" onclick="deleteMatch(${idx})">削除</button>
                </div>`;
        });

        // 手合い
        const handiBody = document.getElementById('handicap-list');
        handiBody.innerHTML = '';
        let topName = (sorted[0].wins === sorted[1].wins) ? null : sorted[0].name;
        let bottomName = (sorted[2].wins === sorted[3].wins) ? null : sorted[3].name;

        for(let i=0; i<appState.players.length; i++) {
            for(let j=i+1; j<appState.players.length; j++) {
                let p1 = appState.players[i]; let p2 = appState.players[j]; let h = "互先";
                if (topName && bottomName) {
                    if ((p1 === topName && p2 === bottomName) || (p1 === bottomName && p2 === topName)) {
                        h = `<strong>先</strong>（${topName}の白番・コミなし）`;
                    }
                }
                handiBody.innerHTML += `<tr><td>${p1} vs ${p2}</td><td>${h}</td></tr>`;
            }
        }
    }

    
window.onload = init;
</script>
</body>
</html>
