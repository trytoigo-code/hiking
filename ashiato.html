<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>足あと</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f5;}
.header{background:#fff;padding:16px;border-bottom:1px solid #ddd;}
.title{font-size:28px;font-weight:bold;}
.subtitle{color:#666;margin-top:4px;}
.tabs{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;}
.tab.active{font-weight:bold;border-bottom:3px solid #000;}
.content{padding:12px;}
.page{display:none;}
.page.active{display:block;}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid #e5e5e5;}
.stat{display:flex;gap:10px;}
.stat .card{flex:1;text-align:center;}
.big{font-size:24px;font-weight:bold;}
</style>
</head>
<body>

<div class="header">
<div class="title">足あと</div>
<div class="subtitle">仲間との活動履歴</div>
</div>

<div class="tabs">
<div class="tab active" data-page="0">記録</div>
<div class="tab" data-page="1">仲間</div>
<div class="tab" data-page="2">希望</div>
<div class="tab" data-page="3">設定</div>
</div>

<div class="content">

<div class="page active">
<div class="stat">
<div class="card"><div class="big">57</div>活動回数</div>
<div class="card"><div class="big">34</div>訪問先</div>
</div>

<div class="card"><b>2026/05/10 川越散策</b><br>参加6名</div>
<div class="card"><b>2026/04/20 秩父ハイキング</b><br>参加8名</div>
<div class="card"><b>2026/03/15 上野美術館</b><br>参加5名</div>
</div>

<div class="page">
<div class="card"><b>西さん</b><br>参加42回</div>
<div class="card"><b>Aさん</b><br>参加37回</div>
<div class="card"><b>Bさん</b><br>参加31回</div>
</div>

<div class="page">
<div class="card"><b>鎌倉</b><br>希望者5名</div>
<div class="card"><b>熱海</b><br>希望者4名</div>
<div class="card"><b>小田原</b><br>希望者3名</div>
</div>

<div class="page">
<div class="card">設定（試作版）</div>
</div>

</div>

<script>
const tabs=document.querySelectorAll('.tab');
const pages=document.querySelectorAll('.page');

tabs.forEach(tab=>{
 tab.addEventListener('click',()=>{
   const idx=parseInt(tab.dataset.page);
   tabs.forEach(t=>t.classList.remove('active'));
   pages.forEach(p=>p.classList.remove('active'));
   tab.classList.add('active');
   pages[idx].classList.add('active');
 });
});
</script>

</body>
</html>
